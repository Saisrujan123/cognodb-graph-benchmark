# Dataset
dataset.source.url=https://snap.stanford.edu/data/wiki-Vote.txt.gz
dataset.source.sha256=7d3e53626e14b8b09fb3b396bece9d481ad606bd64ceab066349ff57d4ada7fc
dataset.expected.nodes=7115
dataset.expected.relationships=103689
dataset.raw.path=data/raw/Wiki-Vote.txt.gz
dataset.nodes.path=data/prepared/nodes.csv
dataset.relationships.path=data/prepared/relationships.csv
dataset.sample.path=data/samples/start-nodes.csv
dataset.bucket.count=100
sample.size=256
random.seed=20260818

# Workload
load.batch.size=500
query.timeout.seconds=30
read.warmup.iterations=256
read.measure.iterations=1024
read.trials=3
mixed.warmup.seconds=20
mixed.measure.seconds=60
mixed.trials=3
mixed.concurrencies=1,10,40
mixed.write.percent=10
results.path=results

# Platforms. Values ending in .env are environment-variable names, never secrets.
platforms=cognodb,neo4j,memgraph,falkordb,arangodb

cognodb.name=CognoDB Cloud
cognodb.adapter=bolt
cognodb.flavor=cognodb
cognodb.uri.env=COGNODB_URI
cognodb.username.env=COGNODB_USERNAME
cognodb.password.env=COGNODB_PASSWORD
cognodb.database.env=COGNODB_DATABASE
cognodb.region.env=COGNODB_REGION
cognodb.deployment=managed free tier
cognodb.tier=c0 free
cognodb.vcpu=0.5 burstable
cognodb.memory.mb=256
cognodb.storage.gb=1
cognodb.load.method=Bolt driver batches of 500

neo4j.name=Neo4j Community
neo4j.adapter=bolt
neo4j.flavor=neo4j
neo4j.uri.env=NEO4J_URI
neo4j.username.env=NEO4J_USERNAME
neo4j.password.env=NEO4J_PASSWORD
neo4j.database.env=NEO4J_DATABASE
neo4j.region.env=NEO4J_REGION
neo4j.deployment=self-hosted container candidate
neo4j.tier=Community 2026.06.0
neo4j.vcpu=0.5 target
neo4j.memory.mb=256 target
neo4j.storage.gb=1 logical cap
neo4j.load.method=Bolt driver batches of 500

memgraph.name=Memgraph Community
memgraph.adapter=bolt
memgraph.flavor=memgraph
memgraph.uri.env=MEMGRAPH_URI
memgraph.username.env=MEMGRAPH_USERNAME
memgraph.password.env=MEMGRAPH_PASSWORD
memgraph.database.env=MEMGRAPH_DATABASE
memgraph.region.env=MEMGRAPH_REGION
memgraph.deployment=self-hosted container candidate
memgraph.tier=Community 3.12.0
memgraph.vcpu=0.5 target
memgraph.memory.mb=256 target
memgraph.storage.gb=1 logical cap
memgraph.load.method=Bolt driver batches of 500

falkordb.name=FalkorDB
falkordb.adapter=falkor
falkordb.uri.env=FALKORDB_URI
falkordb.username.env=FALKORDB_USERNAME
falkordb.password.env=FALKORDB_PASSWORD
falkordb.graph.env=FALKORDB_GRAPH
falkordb.region.env=FALKORDB_REGION
falkordb.deployment=self-hosted container candidate
falkordb.tier=Server 4.20.1
falkordb.vcpu=0.5 target
falkordb.memory.mb=256 target
falkordb.storage.gb=1 logical cap
falkordb.load.method=Redis/Falkor query batches of 500

arangodb.name=ArangoDB Community
arangodb.adapter=arango
arangodb.uri.env=ARANGODB_URI
arangodb.username.env=ARANGODB_USERNAME
arangodb.password.env=ARANGODB_PASSWORD
arangodb.database.env=ARANGODB_DATABASE
arangodb.graph.env=ARANGODB_GRAPH
arangodb.region.env=ARANGODB_REGION
arangodb.deployment=self-hosted container candidate
arangodb.tier=Community 3.12.9
arangodb.vcpu=0.5 target
arangodb.memory.mb=256 target
arangodb.storage.gb=1 logical cap
arangodb.load.method=HTTP/AQL batches of 500
